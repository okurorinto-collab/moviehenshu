<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<title>cutto</title>
<style>
  :root{
    --bg:#0E1014; --s1:#171A21; --s2:#20242E; --s3:#2A2F3B;
    --tx:#F1F2F6; --mu:#8C93A6; --line:rgba(255,255,255,.07);
    --ac:#DAEF8B; --ac2:#DAEF8B; --acink:#141A08;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro JP","Hiragino Sans","Noto Sans JP",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:520px;margin:0 auto;padding:20px 20px calc(104px + env(safe-area-inset-bottom))}

  /* top */
  .top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}
  .top h1{margin:0;display:flex;align-items:center;gap:10px}
  .logo{height:26px;width:auto;display:block}
  .top small{color:var(--mu);font-size:12px;margin-left:8px;font-weight:500}

  /* preview */
  .preview{position:relative;background:#000;border-radius:var(--r);overflow:hidden;display:none;aspect-ratio:9/16;max-height:52vh;margin:0 auto 20px}
  .preview.show{display:block}
  .preview canvas{width:100%;height:100%;object-fit:contain;display:block}
  .working{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(10,12,16,.78);backdrop-filter:blur(6px)}
  .preview.busy .working{display:flex}
  .working em{font-style:normal;font-size:40px;font-weight:600;letter-spacing:-.02em}
  .working span{font-size:13px;color:var(--mu)}
  .ring{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--ac);border-radius:50%;animation:sp .9s linear infinite;margin-bottom:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);display:none}
  .preview.busy .bar{display:block}.bar i{display:block;height:100%;width:0;background:var(--ac)}

  /* timeline */
  .tl-wrap{background:var(--s1);border-radius:var(--r);padding:18px}
  .tl-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mu);margin:0 2px 14px}
  .tl-head b{color:var(--tx);font-weight:600}
  .tl{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
  .tl::-webkit-scrollbar{display:none}
  .cl{position:relative;flex:0 0 auto;width:66px;height:88px;border-radius:12px;overflow:hidden;background:var(--s3);border:2px solid transparent;scroll-snap-align:start;cursor:pointer}
  .cl img{width:100%;height:100%;object-fit:cover;display:block}
  .cl.sel{border-color:var(--ac)}
  .cl .n{position:absolute;top:5px;left:6px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .cl .s{position:absolute;right:5px;bottom:5px;font-size:11px;font-weight:600;background:var(--ac);color:var(--acink);padding:2px 6px;border-radius:6px}
  .cl.ld img{opacity:.3}
  .cl .sp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .cl .sp i{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
  .cl.add{border:1.5px dashed rgba(255,255,255,.18);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:26px;font-weight:300}
  .cl.add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:0;cursor:pointer}
  .tl-empty{display:flex;align-items:center;gap:12px;padding:6px 2px}
  .tl-empty .cl.add{width:64px;height:84px}
  .tl-empty p{margin:0;font-size:13px;color:var(--mu);line-height:1.6}

  /* inspector */
  .insp{display:none;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
  .insp.show{display:flex}
  .seg{display:flex;background:var(--s2);border-radius:12px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--mu);font:inherit;font-size:13px;font-weight:600;padding:8px 11px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--ac);color:var(--acink)}
  .seg button:disabled{opacity:.3;cursor:default}
  .ic{display:flex;gap:6px}
  .ic button{width:40px;height:38px;border:0;border-radius:12px;background:var(--s2);color:var(--tx);font-size:15px;cursor:pointer}
  .ic button:disabled{opacity:.3;cursor:default}
  .ic button.del{color:#FF8A8A}

  /* panels */
  .panel{background:var(--s1);border-radius:var(--r);padding:18px;margin-top:16px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;min-height:52px;flex-wrap:wrap;padding:9px 0}
  .row+.row{border-top:1px solid var(--line)}
  .row .lb{font-size:14px;color:var(--tx);display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
  .row .lb .i{width:20px;height:20px;color:var(--ac);flex:0 0 auto}
  .row .seg,.row .sw{margin-left:auto}
  .row .lb small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
  .field{display:flex;flex-direction:column;gap:8px;flex:1}
  .field:first-child{margin-right:4px}
  .field label{font-size:12px;color:var(--mu)}
  input[type=text],input[type=date]{font:inherit;font-size:16px;padding:13px 14px;border:0;border-radius:12px;background:var(--s2);color:var(--tx);width:100%;color-scheme:dark}
  input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;border:0;font:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;padding:9px 13px;border-radius:12px;background:var(--s2);color:var(--mu);cursor:pointer}
  .chips button.on{background:var(--ac);color:var(--acink)}
  .rangeTgl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);cursor:pointer}
  .rangeTgl input{width:16px;height:16px;accent-color:var(--ac);margin:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sw{position:relative;width:48px;height:28px;flex:0 0 auto}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .sw i{position:absolute;inset:0;background:var(--s3);border-radius:999px;transition:background .15s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
  .sw input:checked+i{background:var(--ac)}.sw input:checked+i::after{transform:translateX(20px);background:var(--acink)}

  /* bottom action */
  .dock{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
  .dock .in{max-width:520px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
  .btn{flex:1;font:inherit;font-size:15px;font-weight:600;padding:17px 18px;border-radius:12px;border:0;cursor:pointer;text-align:center;text-decoration:none;color:var(--acink);background:var(--ac);transition:transform .08s}
  .btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;cursor:default}
  .btn.ghost{background:var(--s2);color:var(--tx)}

  .result{display:none;margin-top:16px}
  .result.show{display:block}
  .result video{width:100%;border-radius:var(--r);background:#000;display:block}
  .result p{font-size:12px;color:var(--mu);margin:8px 2px 0;word-break:break-all}
  .err{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#2E1A1E;color:#FFB4B4;font-size:13px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><h1><svg class="logo" viewBox="0 0 640 240" role="img" aria-label="cutto"><g fill="none" stroke="#F4F5F0" stroke-width="29" stroke-linejoin="round"><path d="M132 103 C120 88 105 81 88 81 C57 81 38 103 38 132 C38 161 57 183 88 183 C105 183 120 176 132 161"/><path d="M168 81 V143 C168 169 181 183 204 183 C227 183 240 169 240 143 V81"/><path d="M288 42 V149 C288 173 299 183 321 183 H336"/><path d="M264 91 H335"/><path d="M377 42 V149 C377 173 388 183 410 183 H425"/><path d="M353 91 H424"/><path d="M500 81 C470 81 452 103 452 132 C452 161 470 183 500 183 C530 183 548 161 548 132 C548 103 530 81 500 81 Z"/></g><circle cx="599" cy="177" r="20" fill="#DAEF8B"/></svg><small id="total"></small></h1></div>

  <div class="preview" id="preview">
    <canvas id="canvas"></canvas>
    <div class="working"><i class="ring"></i><em id="wkPct">0%</em><span id="wkSub">書き出し中…</span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <section class="tl-wrap">
    <div class="tl-head"><span><b id="count">0</b> 本</span><span>左から順につながります</span></div>
    <div class="tl-empty" id="tlEmpty">
      <label class="cl add">＋<input type="file" accept="video/*" multiple id="file0"></label>
      <p>動画をまとめて選ぶと<br>冒頭だけ切り出して1本にします</p>
    </div>
    <div class="tl" id="tl" style="display:none"></div>
    <div class="insp" id="insp">
      <div class="seg" id="lenSeg"><button data-v="1">1秒</button><button data-v="2">2秒</button><button data-v="3">3秒</button></div>
      <div class="ic"><button id="mvL" title="左へ">←</button><button id="mvR" title="右へ">→</button><button id="del" class="del" title="削除">✕</button></div>
    </div>
  </section>

  <section class="panel">
    <div class="field" style="margin-bottom:16px"><label>カテゴリ<small style="color:var(--mu)">（タイトルの上に小さく入ります）</small></label>
      <div class="chips" id="tags"></div>
      <input id="tagCustom" type="text" placeholder="自由に入力（例：BIRTHDAY）" maxlength="16" style="display:none;margin-top:8px;text-transform:uppercase">
    </div>
    <div class="field" style="margin-bottom:16px"><label>タイトル</label><input id="title" type="text" placeholder="今日のできごと" maxlength="30"></div>
    <div class="field"><label style="display:flex;justify-content:space-between;align-items:center">日付
        <span class="rangeTgl"><input id="isRange" type="checkbox"><span>期間にする</span></span></label>
      <div class="two"><input id="date" type="date"><input id="date2" type="date" style="display:none"></div>
    </div>
  </section>

  <section class="panel">
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg><span>1本あたり<small>全クリップに適用</small></span></div>
      <div class="seg" id="len"><button data-v="1">1秒</button><button data-v="2">2秒</button><button data-v="3" class="on">3秒</button></div></div>
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 12h18M12 5v14" opacity=".45"/></svg><span>サイズ</span></div>
      <div class="seg" id="ratio"><button data-v="16:9">16:9</button><button data-v="9:16" class="on">9:16</button><button data-v="1:1">1:1</button></div></div>
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M9 9h6v6H9z"/><path d="M9 9 6 6M15 9l3-3M9 15l-3 3M15 15l3 3" opacity=".6"/></svg><span>収め方<small>Fill＝画面いっぱい／Fit＝全体表示</small></span></div>
      <div class="seg" id="fit"><button data-v="fill" class="on">Fill</button><button data-v="fit">Fit</button></div></div>
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M12 6v12M8 18h8"/></svg><span>タイトル表示時間</span></div>
      <div class="seg" id="dur"><button data-v="1" class="on">1秒</button><button data-v="2">2秒</button><button data-v="3">3秒</button><button data-v="4">4秒</button><button data-v="5">5秒</button><button data-v="6">6秒</button></div></div>
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 9.5 6 15 18M6.2 13.5h6.6"/><path d="M16 18 18.5 12 21 18" opacity=".6"/></svg><span>文字サイズ</span></div>
      <div class="seg" id="size"><button data-v="1">小</button><button data-v="2" class="on">中</button><button data-v="3">大</button></div></div>
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>日付を入れる</span></div><label class="sw"><input id="showDate" type="checkbox" checked><i></i></label></div>
    <div class="row"><div class="lb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l4 3.5V6.5L7 10H4z"/><path d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10" opacity=".6"/></svg><span>音声を含める</span></div><label class="sw"><input id="audio" type="checkbox" checked><i></i></label></div>
  </section>

  <div class="err" id="err"></div>

  <div class="result" id="result">
    <video id="out" controls playsinline></video>
    <p id="meta"></p>
    <div style="display:flex;gap:10px;margin-top:10px"><a class="btn" id="dl" download>保存する</a></div>
  </div>
</main>

<div class="dock"><div class="in"><button class="btn" id="export" disabled>書き出す</button></div></div>

<script>
const $=id=>document.getElementById(id);
const preview=$('preview'),canvas=$('canvas'),ctx=canvas.getContext('2d');
const FONT='-apple-system,"Hiragino Sans","Noto Sans JP",Roboto,system-ui,sans-serif';
const SIZES={'16:9':[1920,1080],'9:16':[1080,1920],'1:1':[1080,1080]};
let CLIP=3, sizeLv=2, titleDur=1, tag='', clips=[], selected=-1, recording=false, ratio='9:16', fitMode='fill', audioCtx=null, audioDest=null;

const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=(v,full=true)=>{if(!v)return'';const [y,m,d]=v.split('-').map(Number);return full?`${y}.${m}.${d}`:`${m}.${d}`;};
const prettyDate=()=>{const a=$('date').value,b=$('isRange').checked?$('date2').value:'';
  if(!a)return b?fmt(b):'';if(!b||b===a)return fmt(a);
  const sameYear=a.slice(0,4)===b.slice(0,4);return `${fmt(a)} - ${fmt(b,!sameYear)}`;};
const seek=(v,t)=>new Promise(res=>{const h=()=>{v.removeEventListener('seeked',h);res()};v.addEventListener('seeked',h);v.currentTime=t;});
$('date').value=isoDate(new Date());
const TAGS=[['','なし'],['✈️','TRIP'],['🎬','VLOG'],['☀️','DAILY'],['🛋️','WEEKEND'],['🍽️','FOOD'],['☕','CAFE'],['🏠','FAMILY'],['🫶','FRIENDS'],['💐','DATE'],['🎉','EVENT'],['💼','WORK'],['🏃','WORKOUT'],['📷','MEMORY'],['✏️','その他']];
let tagEmoji='';
TAGS.forEach(([e,t],i)=>{const b=document.createElement('button');b.textContent=e?`${e} ${t}`:t;b.className=i===0?'on':'';
  b.onclick=()=>{[...$('tags').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
    $('tagCustom').style.display=t==='その他'?'block':'none';
    tagEmoji=(t==='なし'||t==='その他')?'':e;
    tag=t==='なし'?'':t==='その他'?$('tagCustom').value.trim().toUpperCase():t;
    if(t==='その他')$('tagCustom').focus();previewDraw();};
  $('tags').appendChild(b);});
$('tagCustom').oninput=()=>{tag=$('tagCustom').value.trim().toUpperCase();previewDraw();};

function setCanvasSize(){const [w,h]=SIZES[ratio];canvas.width=w;canvas.height=h;preview.style.aspectRatio=`${w}/${h}`;}
setCanvasSize();

/* files */
function onFiles(inp){[...inp.files].forEach(addClip);inp.value='';}
$('file0').onchange=()=>onFiles($('file0'));

function addClip(file){
  const v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.muted=true;
  v.src=URL.createObjectURL(file);
  const c={file,video:v,len:CLIP,dur:0,thumb:'',ready:false};
  if(clips.length===0&&file.lastModified)$('date').value=isoDate(new Date(file.lastModified));
  clips.push(c);render();
  v.onloadedmetadata=async()=>{
    c.dur=v.duration;await seek(v,0);
    const t=document.createElement('canvas');t.width=128;t.height=168;
    const s=Math.max(128/v.videoWidth,168/v.videoHeight);
    t.getContext('2d').drawImage(v,(128-v.videoWidth*s)/2,(168-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);
    c.thumb=t.toDataURL('image/jpeg',.72);c.ready=true;
    if(selected<0)selected=clips.indexOf(c);
    render();previewDraw();
  };
  const fail=(why)=>{if(!clips.includes(c))return;showErr(`「${file.name}」は読み込めませんでした。${why}`);URL.revokeObjectURL(v.src);clips=clips.filter(x=>x!==c);selected=Math.min(selected,clips.length-1);render();previewDraw();};
  v.onerror=()=>{
    const code=v.error&&v.error.code, mb=(file.size/1024/1024).toFixed(1);
    let why;
    if(code===4||code===3) why=`このブラウザで再生できない形式です（${file.type||'形式不明'}・${mb}MB）。iPhoneやGalaxyの高効率形式（HEVC/H.265）の可能性が高いので、カメラ設定を「互換性優先」「H.264」にして撮り直すか、一度スマホ標準の編集で書き出してから読み込んでください。`;
    else if(code===2) why=`読み込み中に中断されました（${mb}MB）。ファイルが壊れているか、容量が大きすぎる可能性があります。もう一度選んでください。`;
    else if(code===1) why=`読み込みが中断されました。もう一度選んでください。`;
    else why=`原因不明のエラーです（${file.type||'形式不明'}・${mb}MB）。別のブラウザで試してください。`;
    fail(why);
  };
  setTimeout(()=>{ if(!c.ready&&clips.includes(c)&&v.readyState<1) fail('30秒待っても情報を取得できませんでした。容量が大きすぎるか、対応していない形式の可能性があります。'); },30000);
}

/* timeline */
function render(){
  const tl=$('tl'),has=clips.length>0;
  $('tlEmpty').style.display=has?'none':'flex';tl.style.display=has?'flex':'none';
  preview.classList.toggle('show',has);
  tl.innerHTML='';
  clips.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='cl'+(i===selected?' sel':'')+(c.ready?'':' ld');
    el.innerHTML=`<img src="${c.thumb}" alt=""><span class="n">${i+1}</span>${c.ready?`<span class="s">${Math.min(c.len,c.dur).toFixed(0)}s</span>`:'<div class="sp"><i></i></div>'}`;
    el.onclick=()=>{selected=i;render();previewDraw();};
    tl.appendChild(el);
  });
  const add=document.createElement('label');add.className='cl add';
  add.innerHTML='＋<input type="file" accept="video/*" multiple>';
  add.querySelector('input').onchange=e=>onFiles(e.target);
  tl.appendChild(add);
  if(selected>=0&&tl.children[selected]) tl.children[selected].scrollIntoView({inline:'nearest',block:'nearest'});

  const c=clips[selected];
  $('insp').classList.toggle('show',!!c);
  if(c){
    $('lenSeg').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.v===c.len);b.disabled=c.dur&&c.dur<+b.dataset.v;});
    $('mvL').disabled=selected===0;$('mvR').disabled=selected===clips.length-1;
  }
  const tot=clips.reduce((a,c)=>a+Math.min(c.len,c.dur||c.len),0);
  $('count').textContent=clips.length;
  $('total').textContent=has?`合計 ${tot.toFixed(0)}秒`:'';
  $('export').disabled=!clips.some(c=>c.ready)||recording;
  if(!recording)$('export').textContent=has?`書き出す（${tot.toFixed(0)}秒）`:'書き出す';
}
$('lenSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=clips[selected];if(c){c.len=+b.dataset.v;render();}});
$('mvL').onclick=()=>{const i=selected;[clips[i-1],clips[i]]=[clips[i],clips[i-1]];selected=i-1;render();};
$('mvR').onclick=()=>{const i=selected;[clips[i+1],clips[i]]=[clips[i],clips[i+1]];selected=i+1;render();};
$('del').onclick=()=>{const c=clips[selected];if(!c)return;URL.revokeObjectURL(c.video.src);clips.splice(selected,1);selected=Math.min(selected,clips.length-1);render();previewDraw();};

/* draw */
function drawVideo(v){
  const W=canvas.width,H=canvas.height,vw=v.videoWidth,vh=v.videoHeight;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const s=fitMode==='fill'?Math.max(W/vw,H/vh):Math.min(W/vw,H/vh);
  const dw=vw*s,dh=vh*s;ctx.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);
}
function drawTitle(){
  const W=canvas.width,H=canvas.height,base=Math.min(W,H);
  const titleSize=Math.round(base*[0.055,0.075,0.1][sizeLv-1]),dateSize=Math.round(titleSize*0.42);
  const t=$('title').value.trim(),d=$('showDate').checked?prettyDate():'',g=tag;
  if(!t&&!d&&!g)return;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=base*0.02;ctx.shadowOffsetY=base*0.004;
  const tagSize=Math.round(titleSize*0.36),gapS=titleSize*0.35,gapD=titleSize*0.4;
  const total=(g?tagSize:0)+(g&&(t||d)?gapS:0)+(t?titleSize:0)+(t&&d?gapD:0)+(d?dateSize:0);
  let y=H/2-total/2;
  if(g){ctx.font=`600 ${tagSize}px ${FONT}`;const ls=tagSize*0.28;
    const chars=[...g];const tw=chars.reduce((a,ch)=>a+ctx.measureText(ch).width,0)+ls*(chars.length-1);
    const ew=tagEmoji?ctx.measureText(tagEmoji).width+tagSize*0.45:0;
    let x=W/2-(tw+ew)/2;ctx.textAlign='left';
    if(tagEmoji){ctx.save();ctx.shadowColor='transparent';ctx.fillText(tagEmoji,x,y+tagSize/2);ctx.restore();x+=ew;}
    chars.forEach(ch=>{ctx.fillText(ch,x,y+tagSize/2);x+=ctx.measureText(ch).width+ls;});ctx.textAlign='center';
    y+=tagSize+gapS;}
  if(t){ctx.font=`600 ${titleSize}px ${FONT}`;ctx.fillText(t,W/2,y+titleSize/2,W*0.9);y+=titleSize+gapD;}
  if(d){ctx.font=`500 ${dateSize}px ${FONT}`;ctx.globalAlpha=.9;ctx.fillText(d,W/2,y+dateSize/2);}
  ctx.restore();
}
function previewDraw(){if(recording)return;const c=clips[selected];if(!c||!c.ready){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);return;}drawVideo(c.video);if(selected===0)drawTitle();}

/* settings */
function seg(id,cb){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v);});}
seg('ratio',v=>{ratio=v;setCanvasSize();previewDraw();});
seg('fit',v=>{fitMode=v;previewDraw();});
seg('len',v=>{CLIP=+v;clips.forEach(c=>c.len=CLIP);render();});
seg('size',v=>{sizeLv=+v;previewDraw();});
seg('dur',v=>{titleDur=+v;});
$('title').oninput=previewDraw;$('date').oninput=previewDraw;$('date2').oninput=previewDraw;$('showDate').onchange=previewDraw;
$('isRange').onchange=()=>{const on=$('isRange').checked;$('date2').style.display=on?'block':'none';if(on&&!$('date2').value)$('date2').value=$('date').value;previewDraw();};

/* export */
$('export').onclick=async()=>{
  const list=clips.filter(c=>c.ready);if(!list.length||recording)return;
  recording=true;showErr('');$('export').disabled=true;$('export').textContent='書き出し中…';
  preview.classList.add('busy');$('bar').style.width='0';$('wkPct').textContent='0%';$('wkSub').textContent='書き出し中…';$('result').classList.remove('show');
  preview.scrollIntoView({behavior:'smooth',block:'start'});
  const total=list.reduce((a,c)=>a+Math.min(c.len,c.dur),0);
  const stream=canvas.captureStream(30);
  if($('audio').checked){
    try{
      if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioDest=audioCtx.createMediaStreamDestination();}
      if(audioCtx.state==='suspended')await audioCtx.resume();
      list.forEach(c=>{if(!c.node){c.node=audioCtx.createMediaElementSource(c.video);c.node.connect(audioDest);}c.video.muted=false;c.video.volume=1;});
      audioDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    }catch(e){}
  }
  const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8_000_000}:undefined);
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const finished=new Promise(r=>rec.onstop=r);

  await seek(list[0].video,0);drawVideo(list[0].video);drawTitle();
  rec.start(100);
  let done=0;
  try{
    for(let i=0;i<list.length;i++){
      const c=list[i],v=c.video,L=Math.min(c.len,c.dur);
      if(i>0)await seek(v,0);
      await v.play();
      await new Promise(res=>{
        const tick=()=>{
          const el=v.currentTime;
          if(el>=L||v.ended){v.pause();res();return;}
          drawVideo(v);if(done+el<titleDur)drawTitle();
          const pct=Math.min(100,(done+el)/total*100);
          $('bar').style.width=pct+'%';$('wkPct').textContent=Math.round(pct)+'%';$('wkSub').textContent=`${i+1} / ${list.length} 本目`;
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
      done+=L;
    }
  }catch(e){showErr('再生を開始できませんでした。もう一度お試しください。');}
  $('wkPct').textContent='100%';$('wkSub').textContent='仕上げ中…';
  rec.stop();await finished;

  const blob=new Blob(chunks,{type:rec.mimeType||mime});
  const ext=(rec.mimeType||mime).includes('mp4')?'mp4':'webm';
  const url=URL.createObjectURL(blob);
  const safe=($('title').value.trim()||'clip').replace(/[\\/:*?"<>|]/g,'_');
  const name=`cutto_${$('date').value}_${safe}_${ratio.replace(':','x')}.${ext}`;
  $('out').src=url;$('dl').href=url;$('dl').download=name;
  $('meta').textContent=`${name}（${(blob.size/1024/1024).toFixed(1)} MB）`;
  $('result').classList.add('show');
  list.forEach(c=>{c.video.muted=true;});
  recording=false;preview.classList.remove('busy');render();previewDraw();
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
};

function showErr(m){$('err').textContent=m;$('err').style.display=m?'block':'none';}
if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)showErr('このブラウザは動画の書き出しに対応していません。Chrome の最新版でお試しください。');
</script>
